version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: finguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: finguard
      POSTGRES_PASSWORD: finguard_secret_change_in_prod
      POSTGRES_DB: finguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finguard -d finguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: finguard-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles:
      - with-redis

volumes:
  postgres_data:
  redis_data:
